<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Rissgefecht – Versuch</title>
  <link rel="icon" href="img/favicon.svg">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0a0910; color: #efe8d8; font-family: Inter, system-ui, sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; touch-action: none; }
    #rg { display: flex; flex-direction: column; align-items: center; height: 100%; }
    #rg-kopf, #rg-fuss { width: 100%; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 6px 10px; background: #14111c; font-size: 14px; flex-wrap: wrap; min-height: 40px; }
    #rg-fuss { min-height: 64px; gap: 10px; }
    #rg-feld { display: block; background: #15131d; cursor: crosshair; }
    .rg-stand { font-size: 22px; font-weight: 700; } .blau { color: #6aa5ff; } .rot { color: #ff6a6a; }
    .rg-zeit { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px; min-width: 48px; text-align: center; } .rg-zeit.knapp { color: #ff9a9d; }
    .rg-halten { width: 90px; height: 8px; background: #2a2636; border-radius: 4px; overflow: hidden; } .rg-halten i { display: block; height: 100%; } .rg-halten i.blau { background: #6aa5ff; } .rg-halten i.rot { background: #ff6a6a; }
    .rg-ich { display: grid; gap: 2px; min-width: 150px; font-size: 13px; } .rg-ich small { color: #b9ad94; font-size: 11px; }
    .rg-balken { display: block; height: 7px; background: #2a2636; border-radius: 4px; overflow: hidden; } .rg-balken u { display: block; height: 100%; background: #5fd08a; } .rg-balken.xp { height: 4px; } .rg-balken.xp u { background: #6aa5ff; }
    .rg-cd { position: relative; width: 62px; height: 52px; border-radius: 10px; border: 2px solid #b79bff; background: #221c33; display: grid; place-items: center; align-content: center; overflow: hidden; cursor: pointer; }
    .rg-cd b { font-size: 16px; position: relative; } .rg-cd small { font-size: 9px; position: relative; text-align: center; line-height: 1.05; color: #d9cdf5; }
    .rg-cd i { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.65); } .rg-cd.zu { border-color: #4b4460; color: #8d84a6; }
    .rg-meld { display: grid; gap: 1px; min-width: 220px; font-size: 12px; } .rg-meld em { font-style: normal; color: #cfc3a8; } .rg-meld em.gut { color: #8dffb0; } .rg-meld em.schlecht { color: #ff9a9d; } .rg-meld em.gross { color: #ffd98a; font-weight: 600; }
    #rg-fenster { position: fixed; inset: 0; background: rgba(6,5,10,.88); display: grid; place-items: start center; overflow-y: auto; padding: 16px; z-index: 5; touch-action: pan-y; }
    #rg-fenster[hidden] { display: none; }
    .rg-blatt { width: min(760px, 100%); background: #1a1626; border: 1px solid #4b4460; border-radius: 14px; padding: 18px 20px; margin: auto 0; user-select: text; -webkit-user-select: text; }
    .rg-blatt h1 { margin: 2px 0 8px; font-family: Cinzel, Georgia, serif; color: #ffd98a; font-size: 28px; } .rg-blatt h1.gut { color: #8dffb0; } .rg-blatt h1.schlecht { color: #ff9a9d; }
    .rg-blatt p { margin: 6px 0; line-height: 1.45; } .rg-klein { font-size: 12px; color: #a99fbf; text-transform: uppercase; letter-spacing: .08em; } p.rg-klein:last-child { text-transform: none; letter-spacing: 0; }
    .rg-helden { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 12px 0; }
    .rg-held { display: grid; gap: 3px; justify-items: center; padding: 10px 8px; border-radius: 12px; border: 2px solid #4b4460; background: #221c33; color: inherit; font: inherit; cursor: pointer; text-align: center; }
    .rg-held img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; object-position: top; } .rg-held small { font-size: 11px; color: #b9ad94; } .rg-held small i { font-style: normal; color: #ffd98a; font-weight: 700; }
    .rg-held.an { border-color: #ffd75e; box-shadow: 0 0 16px rgba(246,200,66,.4); }
    .rg-regeln { margin: 8px 0; padding-left: 20px; font-size: 14px; line-height: 1.45; } .rg-regeln li { margin: 4px 0; }
    .rg-knoepfe { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0 6px; }
    .rg-btn { padding: 11px 20px; border-radius: 10px; border: 1px solid #ffd75e; background: linear-gradient(#5a431a, #3a2a10); color: #ffe9a8; font: 600 15px Inter, sans-serif; cursor: pointer; } .rg-btn.klein { padding: 6px 10px; font-size: 12px; } .rg-btn:disabled { opacity: .4; cursor: default; }
    .rg-team { display: grid; gap: 8px; margin: 10px 0; } .rg-zeile { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; } .rg-zeile img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; object-position: top; } .rg-zeile small { color: #b9ad94; font-size: 12px; }
    .rg-es { font-size: 18px; color: #ff9aa8; } .rg-wechsel { padding: 8px 12px; border-left: 3px solid #ffd75e; background: rgba(246,200,66,.1); border-radius: 6px; }
    .rg-kauf { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
    .rg-ding { display: grid; gap: 3px; padding: 10px; border-radius: 10px; border: 1px solid #b79bff; background: #221c33; color: inherit; font: inherit; text-align: left; cursor: pointer; } .rg-ding small { color: #b9ad94; font-size: 12px; } .rg-ding em { font-style: normal; color: #ff9aa8; font-weight: 600; } .rg-ding:disabled { opacity: .45; cursor: default; } .rg-ding.hat { opacity: 1; border-color: #5fd08a; }
    .rg-tab { width: 100%; border-collapse: collapse; font-size: 13px; margin: 10px 0; } .rg-tab th, .rg-tab td { padding: 4px 6px; text-align: left; border-bottom: 1px solid #2f2a3e; } .rg-tab tr.gut td:nth-child(2) { color: #8dffb0; } .rg-tab tr.schlecht td:nth-child(2) { color: #ff9a9d; }
    @media (max-width: 700px) { #rg-kopf, #rg-fuss { gap: 8px; font-size: 12px; } .rg-meld { display: none; } .rg-halten { width: 54px; } }
  </style>
</head>
<body>
  <div id="rg"><div id="rg-kopf"></div><canvas id="rg-feld" width="1600" height="1000"></canvas><div id="rg-fuss"></div></div>
  <div id="rg-fenster" hidden></div>
  <script src="js/rissgefecht.js?v=1"></script>
</body>
</html>
