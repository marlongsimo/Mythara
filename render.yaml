# Mythara Echtzeit – Spielserver bei Render (Tarif Starter: schläft nicht ein).
services:
  - type: web
    name: mythara-echtzeit
    runtime: node
    plan: starter
    branch: feature/realtime-engine
    rootDir: realtime
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/dist/server.js
    # Nur neu bauen, wenn sich am Server etwas ändert – reine Änderungen am Spiel im Browser starten ihn nicht neu
    buildFilter:
      paths:
        - realtime/server/**
        - realtime/shared/**
        - realtime/package.json
        - realtime/package-lock.json
        - realtime/build.mjs
    healthCheckPath: /
    envVars:
      - key: ERLAUBTE_HERKUNFT
        value: https://mythara-dungeon.de
      - key: NODE_VERSION
        value: "22"
      # Für Kampagnenkämpfe mit Konto (Erfahrung und Seelensplitter schreibt der Server gut, Migration 035):
      - key: SUPABASE_URL
        value: https://jxtxatmydlfemzjeupri.supabase.co
      # Geheim – nur im Render-Dashboard eintragen (Environment), nie in den Code: der „service_role“-Schlüssel aus Supabase
      - key: SUPABASE_SERVICE_KEY
        sync: false
