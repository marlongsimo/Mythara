<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mythara – Skins beim Händler (Prototyp)</title>
  <meta name="robots" content="noindex">
  <base href="../">
  <style>
    @font-face { font-family: "Cinzel"; src: url("fonts/cinzel-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
    @font-face { font-family: "Inter"; src: url("fonts/inter-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
    @font-face { font-family: "Inter"; src: url("fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
    :root { --gold: #e9c77e; --gold-hell: #fff1c8; --linie: rgba(233, 199, 126, .25); --text: #ece4d4; --leise: #a89f8d; --violett: #b9a7ff; --gruen: #9fe0a0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0a0e url("img/dorf/haendler.webp") center top / cover fixed; color: var(--text); font: 400 16px/1.5 Inter, system-ui, sans-serif; }
    body::before { content: ""; position: fixed; inset: 0; background: rgba(9, 8, 12, .86); z-index: -1; }
    h1, h2, h3 { font-family: Cinzel, serif; font-weight: 600; margin: 0; letter-spacing: .03em; }
    button { font: inherit; color: inherit; cursor: pointer; }
    .seite { width: min(1120px, 100% - 28px); margin: 0 auto; padding: 18px 0 60px; }
    .hinweis { margin: 0 0 14px; padding: 8px 12px; border: 1px dashed var(--linie); border-radius: 8px; font-size: 13px; color: var(--leise); }
    .kopf { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 20px; margin-bottom: 14px; }
    .kopf small { display: block; font: 600 11px Inter; letter-spacing: .28em; text-transform: uppercase; color: var(--gold); }
    .kopf h1 { font-size: clamp(26px, 4vw, 38px); color: var(--gold-hell); }
    .geld { padding: 8px 14px; border: 1px solid var(--linie); border-radius: 99px; background: rgba(10, 10, 14, .7); font-weight: 600; white-space: nowrap; }
    .geld i, .preis i { font-style: normal; color: var(--violett); }

    /* Reiter */
    .reiter { display: flex; gap: 4px; border-bottom: 1px solid var(--linie); margin-bottom: 16px; }
    .reiter button { padding: 11px 18px; background: none; border: 0; border-bottom: 3px solid transparent; font: 600 14px Cinzel, serif; letter-spacing: .08em; color: var(--leise); }
    .reiter button.an { color: var(--gold-hell); border-bottom-color: var(--gold); }
    .reiter em { font-style: normal; font: 600 11px Inter; margin-left: 6px; padding: 2px 7px; border-radius: 99px; background: rgba(233, 199, 126, .16); color: var(--gold); }

    /* Pakete */
    .pakete { display: grid; gap: 12px; margin-bottom: 20px; }
    .paket { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 18px; align-items: center; text-align: left; padding: 10px 18px; border-radius: 14px; border: 1px solid #b48cf0; background: radial-gradient(120% 160% at 10% 50%, rgba(140, 70, 220, .38), transparent 60%), #130e1b; position: relative; overflow: hidden; }
    .paket:hover { border-color: #e2c8ff; }
    .faecher { position: relative; width: 190px; height: 132px; }
    .faecher img { position: absolute; left: 50%; bottom: -6px; height: 132px; transform-origin: 50% 105%; transform: translateX(calc(-50% + var(--i) * 48px)) rotate(calc(var(--i) * 11deg)); filter: drop-shadow(0 6px 10px #000); }
    .faecher img:nth-child(2) { z-index: 1; }
    .paket b { display: block; font: 600 22px Cinzel, serif; color: #ecd9ff; }
    .paket small { color: #cfc2e4; }
    .paket .rechts { text-align: right; }
    .paket .band { position: absolute; top: 0; left: 0; padding: 3px 12px; font: 600 10px Inter; letter-spacing: .14em; text-transform: uppercase; background: #a878f0; color: #1a0b2e; border-radius: 0 0 8px 0; }
    .preis { font-weight: 600; white-space: nowrap; } .preis s { color: var(--leise); font-weight: 400; margin-right: 6px; } .preis.gross { font-size: 22px; color: #f0dcff; }
    .uhr { display: block; font-size: 12px; color: var(--leise); }

    /* Filter */
    .filter { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
    .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; }
    .chips button { flex: none; padding: 8px 14px; border-radius: 99px; border: 1px solid var(--linie); background: rgba(10, 10, 14, .6); font: 600 12px Inter; letter-spacing: .06em; color: #cfc6b3; }
    .chips button.an { background: var(--gold); border-color: var(--gold); color: #1a1408; }
    .schalter { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #cfc6b3; white-space: nowrap; }
    .schalter input { accent-color: var(--gold); width: 16px; height: 16px; }

    /* Raster */
    .raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; }
    .karte { position: relative; display: flex; flex-direction: column; text-align: center; padding: 10px 10px 12px; border-radius: 12px; border: 1px solid var(--linie); background: radial-gradient(100% 70% at 50% 62%, color-mix(in srgb, var(--k) 30%, transparent), transparent 72%), #121018; transition: transform .15s, border-color .15s; }
    .karte:hover { transform: translateY(-3px); border-color: var(--gold); }
    .karte img { height: 190px; width: 100%; object-fit: contain; filter: drop-shadow(0 8px 10px rgba(0, 0, 0, .8)); margin-bottom: 6px; }
    .karte b { font: 600 16px Cinzel, serif; color: var(--gold-hell); line-height: 1.15; }
    .karte span { font-size: 12.5px; color: var(--leise); }
    .karte .preis { margin-top: 6px; font-size: 14px; }
    .marke { position: absolute; top: 8px; left: 8px; padding: 3px 8px; border-radius: 6px; font: 600 10px Inter; letter-spacing: .08em; text-transform: uppercase; }
    .marke.paket-m { background: #a878f0; color: #1a0b2e; } .marke.hat { background: rgba(159, 224, 160, .18); color: var(--gruen); border: 1px solid rgba(159, 224, 160, .5); } .marke.an { background: var(--gold); color: #1a1408; }
    .karte.zu img { filter: grayscale(.75) brightness(.65) drop-shadow(0 8px 10px rgba(0, 0, 0, .8)); }
    .karte.zu .preis { color: var(--leise); }
    .schloss { font-size: 12px; color: #d9a08a; margin-top: 4px; }
    .leer { grid-column: 1 / -1; padding: 30px; text-align: center; color: var(--leise); border: 1px dashed var(--linie); border-radius: 12px; }
    .gruppe { grid-column: 1 / -1; margin: 10px 0 0; font: 600 13px Inter; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }

    /* Detail */
    .schleier { position: fixed; inset: 0; z-index: 20; background: rgba(5, 4, 8, .82); backdrop-filter: blur(6px); display: grid; place-items: center; padding: 14px; }
    .schleier[hidden] { display: none; }
    .detail { position: relative; width: min(760px, 100%); max-height: 94vh; overflow: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 22px; border-radius: 16px; border: 1px solid var(--gold); background: radial-gradient(90% 80% at 25% 60%, color-mix(in srgb, var(--k) 34%, transparent), transparent 70%), #14111a; }
    .detail .zu { position: absolute; top: 10px; right: 12px; background: none; border: 0; font-size: 22px; color: var(--leise); }
    .buehne { display: grid; place-items: end center; min-height: 340px; }
    .buehne img { max-height: 420px; max-width: 100%; filter: drop-shadow(0 14px 20px #000); }
    .vergleich { display: flex; gap: 6px; justify-content: center; margin-top: 8px; }
    .vergleich button { padding: 6px 12px; border-radius: 99px; border: 1px solid var(--linie); background: none; font-size: 12px; color: #cfc6b3; }
    .vergleich button.an { background: rgba(233, 199, 126, .18); border-color: var(--gold); color: var(--gold-hell); }
    .detail small.auge { font: 600 11px Inter; letter-spacing: .24em; text-transform: uppercase; color: var(--gold); }
    .detail h2 { font-size: 30px; color: var(--gold-hell); margin: 4px 0 8px; }
    .detail p { margin: 0 0 12px; color: #d6ccb8; }
    .knopf { display: block; width: 100%; padding: 14px; border-radius: 8px; border: 1px solid rgba(233, 199, 126, .7); background: linear-gradient(180deg, #c8383c, #7d1c20); font: 600 14px Cinzel, serif; letter-spacing: .1em; color: #fff6de; }
    .knopf.zweit { background: none; margin-top: 8px; } .knopf:disabled { opacity: .45; cursor: default; }
    .tipp { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: rgba(140, 70, 220, .18); border: 1px solid rgba(180, 140, 240, .5); font-size: 13.5px; }
    .tipp button { background: none; border: 0; padding: 0; color: #e2c8ff; text-decoration: underline; }
    .klein { font-size: 13px; color: var(--leise); margin-top: 8px; }
    @media (max-width: 640px) { .paket { grid-template-columns: 1fr; justify-items: center; text-align: center; padding-top: 26px; } .paket .rechts { text-align: center; } .detail { grid-template-columns: 1fr; } .buehne { min-height: 0; } .buehne img { max-height: 300px; } .raster { grid-template-columns: repeat(2, 1fr); gap: 9px; } .chips { flex: 1 1 100%; } .karte img { height: 160px; } .reiter button { padding: 10px 12px; font-size: 13px; } }
  </style>
</head>
<body>
  <div class="seite">
    <p class="hinweis">Prototyp mit Beispieldaten: Käufe wirken nur auf dieser Seite. Im Beispiel besitzt du 9 von 15 Helden und 1.480 Seelensplitter.</p>
    <div class="kopf"><div><small>Der Händler</small><h1>Skins</h1></div><p class="geld"><i>◈</i> <span id="geld"></span> Seelensplitter</p></div>
    <nav class="reiter" id="reiter"></nav>
    <div id="inhalt"></div>
  </div>
  <div class="schleier" id="schleier" hidden></div>

  <script>
    (function () {
      var H = { schildwaechter: ["Torvald", "krieger"], berserker: ["Ragnar", "krieger"], duellant: ["Isolde", "krieger"], gelehrter: ["Lyra", "zauberer"], elementarist: ["Vaelin", "zauberer"], schattenmagier: ["Morwen", "zauberer"], schattenlaeufer: ["Darian", "schurke"], trickser: ["Silra", "schurke"], assassine: ["Vex", "schurke"], lichtbringer: ["Elara", "kleriker"], wanderheiler: ["Brogar", "kleriker"], inquisitor: ["Seran", "kleriker"], wildnislaeufer: ["Kael", "waldlaeufer"], tiergefaehrte: ["Faye", "waldlaeufer"], kopfgeldjaeger: ["Orin", "waldlaeufer"] };
      var KL = { krieger: ["Krieger", "#c8463c"], zauberer: ["Zauberer", "#6e8cff"], schurke: ["Schurken", "#a06edc"], kleriker: ["Kleriker", "#f0d278"], waldlaeufer: ["Waldläufer", "#6ec878"] };
      var S = [["schildwaechter_s1", "schildwaechter", "Löwenwacht"], ["berserker_wolfsblut", "berserker", "Wolfsblut"], ["duellant_s1", "duellant", "Eulenritterin"], ["gelehrter_sternenkunde", "gelehrter", "Sternenkunde"], ["elementarist_s1", "elementarist", "Sternenrufer"], ["schattenmagier_s1", "schattenmagier", "Rabenkönigin"], ["schattenlaeufer_s1", "schattenlaeufer", "Nachtkrähe"], ["trickser_s1", "trickser", "Kartenlegerin"], ["assassine_rabenschatten", "assassine", "Rabenschatten"], ["assassine_s1", "assassine", "Schattenfürst", "schattenreich"], ["lichtbringer_s1", "lichtbringer", "Morgenweihe"], ["wanderheiler_s1", "wanderheiler", "Lebenshüter"], ["wanderheiler_s2", "wanderheiler", "Schattenheiler", "schattenreich"], ["inquisitor_s1", "inquisitor", "Sonnenrichter"], ["wildnislaeufer_s1", "wildnislaeufer", "Eichenhüter"], ["tiergefaehrte_s1", "tiergefaehrte", "Herbstjägerin"], ["tiergefaehrte_s2", "tiergefaehrte", "Schattenjägerin", "schattenreich"], ["kopfgeldjaeger_s1", "kopfgeldjaeger", "Waldjäger"]].map(function (x) { return { id: x[0], held: x[1], name: x[2], paket: x[3] || null, preis: 650 }; });
      var P = { schattenreich: { name: "Aus dem Schattenreich", preis: 1365, bis: Date.now() + 6.4 * 864e5 } };
      var Z = { geld: 1480, helden: ["schildwaechter", "berserker", "duellant", "gelehrter", "assassine", "lichtbringer", "wanderheiler", "tiergefaehrte", "kopfgeldjaeger"], besitz: ["berserker_wolfsblut", "gelehrter_sternenkunde"], an: { berserker: "berserker_wolfsblut" }, reiter: "laden", klasse: "alle", nurMeine: false };
      var $ = function (s) { return document.querySelector(s); }, gross = function (id) { return "img/figuren/ganz/" + id + "-gross.webp"; };
      var rest = function (b) { var ms = b - Date.now(), t = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5); return t + " T. " + h + " Std."; };
      var hat = function (s) { return Z.besitz.indexOf(s.id) >= 0; }, hatHeld = function (s) { return Z.helden.indexOf(s.held) >= 0; };
      var pSkins = function (pid) { return S.filter(function (s) { return s.paket === pid; }); }, pGekauft = function (pid) { return pSkins(pid).every(hat); };

      function karte(s) {
        var h = H[s.held], an = Z.an[s.held] === s.id, meins = hat(s), zu = !meins && !hatHeld(s);
        var marke = an ? '<i class="marke an">Angelegt</i>' : meins ? '<i class="marke hat">✓ Deins</i>' : s.paket && !pGekauft(s.paket) ? '<i class="marke paket-m">Im Paket</i>' : "";
        return '<button class="karte' + (zu ? " zu" : "") + '" data-skin="' + s.id + '" style="--k:' + KL[h[1]][1] + '">' + marke + '<img src="' + gross(s.id) + '" alt="" loading="lazy"><b>' + s.name + "</b><span>" + h[0] + "</span>" +
          (meins ? "" : '<span class="preis"><i>◈</i> ' + s.preis + "</span>") + (zu ? '<span class="schloss">🔒 Held fehlt</span>' : "") + "</button>";
      }
      function zeichne() {
        $("#geld").textContent = Z.geld.toLocaleString("de-DE");
        var meine = S.filter(hat);
        $("#reiter").innerHTML = '<button data-r="laden" class="' + (Z.reiter === "laden" ? "an" : "") + '">Im Angebot</button><button data-r="meine" class="' + (Z.reiter === "meine" ? "an" : "") + '">Meine Skins<em>' + meine.length + "</em></button>";
        var o = "";
        if (Z.reiter === "laden") {
          var pk = Object.keys(P).filter(function (id) { return !pGekauft(id); });
          if (pk.length) o += '<div class="pakete">' + pk.map(function (id) { var p = P[id], sk = pSkins(id), voll = sk.reduce(function (a, s) { return a + s.preis; }, 0);
            return '<button class="paket" data-paket="' + id + '"><span class="band">★ Sonderangebot · noch ' + rest(p.bis) + '</span><span class="faecher">' + sk.map(function (s, i) { return '<img src="' + gross(s.id) + '" alt="" style="--i:' + (i - 1) + '">'; }).join("") + "</span><span><b>" + p.name + "</b><small>" + sk.length + " Skins: " + sk.map(function (s) { return H[s.held][0]; }).join(", ") + '</small></span><span class="rechts"><span class="preis gross"><s>◈ ' + voll + "</s><i>◈</i> " + p.preis + '</span><span class="uhr">−' + Math.round(100 * (1 - p.preis / voll)) + " % gegenüber Einzelkauf</span></span></button>"; }).join("") + "</div>";
          o += '<div class="filter"><div class="chips">' + [["alle", "Alle"]].concat(Object.keys(KL).map(function (k) { return [k, KL[k][0]]; })).map(function (k) { return '<button data-klasse="' + k[0] + '" class="' + (Z.klasse === k[0] ? "an" : "") + '">' + k[1] + "</button>"; }).join("") + '</div><label class="schalter"><input type="checkbox" id="nur"' + (Z.nurMeine ? " checked" : "") + "> Nur für meine Helden</label></div>";
          var liste = S.filter(function (s) { return !hat(s) && (Z.klasse === "alle" || H[s.held][1] === Z.klasse) && (!Z.nurMeine || hatHeld(s)); });
          liste.sort(function (a, b) { return (hatHeld(b) - hatHeld(a)); });
          o += '<div class="raster">' + (liste.map(karte).join("") || '<p class="leer">Hier gibt es gerade nichts Neues für dich.</p>') + "</div>";
        } else {
          o += '<p class="klein" style="margin:0 0 12px">Tippe einen Skin an, um ihn an- oder abzulegen. Das geht auch auf der Heldenkarte in der Heldenhalle.</p><div class="raster">';
          if (!meine.length) o += '<p class="leer">Du besitzt noch keine Skins. Sieh dich unter „Im Angebot“ um.</p>';
          o += meine.slice().sort(function (a, b) { return Object.keys(H).indexOf(a.held) - Object.keys(H).indexOf(b.held); }).map(karte).join("");
          o += "</div>";
        }
        $("#inhalt").innerHTML = o;
      }
      function detail(id, sicht) {
        var s = S.filter(function (x) { return x.id === id; })[0], h = H[s.held], meins = hat(s), an = Z.an[s.held] === id, zu = !meins && !hatHeld(s), fehlt = Math.max(0, s.preis - Z.geld), p = s.paket && !pGekauft(s.paket) ? P[s.paket] : null;
        sicht = sicht || "skin";
        var knopf = meins ? '<button class="knopf" data-tun="' + (an ? "ab" : "an") + '">' + (an ? "Ablegen" : "Anlegen") + "</button>"
          : zu ? '<button class="knopf" disabled>Für ◈ ' + s.preis + ' kaufen</button><p class="klein">🔒 Du brauchst erst ' + h[0] + " in deiner Sammlung." + (p ? " Im Paket bekommst du den Skin trotzdem; er wartet dann auf den Helden." : "") + "</p>"
          : '<button class="knopf" data-tun="kauf"' + (fehlt ? " disabled" : "") + ">Für ◈ " + s.preis + " kaufen</button>" + (fehlt ? '<p class="klein">Dir fehlen ' + fehlt + " Seelensplitter.</p>" : "");
        $("#schleier").innerHTML = '<div class="detail" style="--k:' + KL[h[1]][1] + '"><button class="zu" data-zu aria-label="Schließen">✕</button><div><div class="buehne"><img src="' + (sicht === "skin" ? gross(id) : "img/figuren/ganz/" + s.held + ".webp") + '" alt=""></div><div class="vergleich"><button data-sicht="skin" class="' + (sicht === "skin" ? "an" : "") + '">' + s.name + '</button><button data-sicht="std" class="' + (sicht === "std" ? "an" : "") + '">Standard</button></div></div>' +
          '<div><small class="auge">Skin für ' + h[0] + " · " + KL[h[1]][0] + "</small><h2>" + s.name + "</h2><p>Ändert nur das Aussehen – im Kampf, in der Heldenhalle und für deine Gegner in der Arena.</p>" + (meins ? '<p class="klein" style="color:var(--gruen)">✓ In deinem Besitz' + (an ? " · angelegt" : "") + "</p>" : '<p class="preis" style="font-size:20px"><i>◈</i> ' + s.preis + " Seelensplitter</p>") + knopf +
          (p && !meins ? '<div class="tipp">Teil von <b>' + p.name + "</b>: alle " + pSkins(s.paket).length + " Skins für ◈ " + p.preis + '. <button data-paket="' + s.paket + '">Paket ansehen</button></div>' : "") + "</div></div>";
        $("#schleier").hidden = false; $("#schleier").dataset.id = id;
      }
      function paket(pid) {
        var p = P[pid], sk = pSkins(pid), voll = sk.reduce(function (a, s) { return a + s.preis; }, 0), fehlt = Math.max(0, p.preis - Z.geld);
        $("#schleier").innerHTML = '<div class="detail" style="--k:#a06edc;grid-template-columns:1fr"><button class="zu" data-zu aria-label="Schließen">✕</button><div><small class="auge">Sonderangebot · noch ' + rest(p.bis) + "</small><h2>" + p.name + '</h2><div class="raster" style="grid-template-columns:repeat(' + sk.length + ',1fr)">' + sk.map(karte).join("") + '</div><p class="preis gross" style="margin:14px 0 10px"><s>◈ ' + voll + "</s><i>◈</i> " + p.preis + ' für alle ' + sk.length + '</p><button class="knopf" data-tun="paketkauf" data-pid="' + pid + '"' + (fehlt ? " disabled" : "") + ">Paket kaufen</button>" + (fehlt ? '<p class="klein">Dir fehlen ' + fehlt + " Seelensplitter.</p>" : "") + '<p class="klein">Gilt auch für Helden, die du noch nicht hast: Die Skins warten in der Heldenhalle.</p></div></div>';
        $("#schleier").hidden = false;
      }
      document.addEventListener("click", function (e) {
        var t = e.target, b;
        if ((b = t.closest("[data-r]"))) { Z.reiter = b.dataset.r; return zeichne(); }
        if ((b = t.closest("[data-klasse]"))) { Z.klasse = b.dataset.klasse; return zeichne(); }
        if (t.id === "nur") { Z.nurMeine = t.checked; return zeichne(); }
        if ((b = t.closest("[data-paket]"))) return paket(b.dataset.paket);
        if ((b = t.closest("[data-skin]"))) return detail(b.dataset.skin);
        if ((b = t.closest("[data-sicht]"))) return detail($("#schleier").dataset.id, b.dataset.sicht);
        if (t.closest("[data-zu]") || t === $("#schleier")) { $("#schleier").hidden = true; return; }
        if ((b = t.closest("[data-tun]"))) { var id = $("#schleier").dataset.id, s = S.filter(function (x) { return x.id === id; })[0];
          if (b.dataset.tun === "kauf") { Z.geld -= s.preis; Z.besitz.push(id); Z.an[s.held] = id; }
          if (b.dataset.tun === "an") Z.an[s.held] = id; if (b.dataset.tun === "ab") delete Z.an[s.held];
          if (b.dataset.tun === "paketkauf") { Z.geld -= P[b.dataset.pid].preis; pSkins(b.dataset.pid).forEach(function (x) { if (!hat(x)) Z.besitz.push(x.id); }); $("#schleier").hidden = true; Z.reiter = "meine"; return zeichne(); }
          zeichne(); return detail(id); }
      });
      zeichne();
    })();
  </script>
</body>
</html>
