<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Mythara – Würfel-Test</title>
  <style>
    @font-face { font-family: "Cinzel"; src: url("fonts/cinzel-latin-600-normal.woff2") format("woff2"); font-weight: 600 700; font-display: swap; }
    @font-face { font-family: "Inter"; src: url("fonts/inter-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
    @font-face { font-family: "Inter"; src: url("fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: #0b0e14; color: #ece4d4; font: 400 15px/1.45 Inter, system-ui, sans-serif; display: flex; flex-direction: column; overscroll-behavior: none; }
    .brett { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #05070b url("img/weidenhain/wehr.webp") center / cover; touch-action: none; cursor: grab; }
    .brett.wackel { animation: wackel .35s; } @keyframes wackel { 20% { transform: translate(-5px, 3px); } 40% { transform: translate(5px, -3px); } 60% { transform: translate(-3px, 2px); } 80% { transform: translate(2px, -1px); } }
    .tipp { position: absolute; left: 0; right: 0; top: 12px; text-align: center; font: 600 12px Cinzel, serif; letter-spacing: .14em; color: #f6dc9c; text-shadow: 0 2px 8px #000; pointer-events: none; }
    .ergebnis { position: absolute; left: 50%; bottom: 18px; transform: translate(-50%, 12px); opacity: 0; transition: .3s; padding: 10px 18px; border-radius: 12px; background: rgba(12, 13, 18, .92); box-shadow: 0 0 0 1px rgba(217, 178, 106, .45), 0 12px 30px rgba(0, 0, 0, .6); text-align: center; white-space: nowrap; pointer-events: none; }
    .ergebnis.da { opacity: 1; transform: translate(-50%, 0); }
    .ergebnis b { font: 700 22px Cinzel, serif; color: #fff1c8; } .ergebnis.krit b { color: #ffd97a; } .ergebnis.patzer b, .ergebnis.fehl b { color: #ff8a80; }
    .ergebnis span { display: block; font-size: 13px; color: #cfc6b3; }
    .pult { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: #14121a; border-top: 1px solid rgba(217, 178, 106, .3); display: grid; gap: 8px; }
    .zeile { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .zeile > small { color: #a89f8d; min-width: 62px; }
    button, select { font: 600 14px Inter, sans-serif; color: #ece4d4; background: #23202b; border: 1px solid rgba(217, 178, 106, .35); border-radius: 8px; padding: 9px 12px; cursor: pointer; }
    button.haupt { background: #a3262b; border-color: #c8383c; color: #fff; padding: 9px 18px; }
    button.an { border-color: #f6dc9c; background: #3a3020; }
    label { display: inline-flex; align-items: center; gap: 6px; color: #cfc6b3; font-size: 14px; }
  </style>
</head>
<body>
  <div class="brett" id="brett">
    <p class="tipp" id="tipp">Auf die Karte tippen oder wischen, um zu würfeln</p>
    <div class="ergebnis" id="ergebnis"></div>
  </div>
  <div class="pult">
    <div class="zeile"><small>Wurf</small>
      <button class="haupt" data-w="zufall">Würfeln</button><button data-w="20">Eine 20</button><button data-w="1">Eine 1</button><button data-w="vorteil">Vorteil</button><button data-w="nachteil">Nachteil</button>
    </div>
    <div class="zeile"><small>Design</small><select id="design"></select>
      <label><input type="checkbox" id="schnell"> schnell</label><label><input type="checkbox" id="ton" checked> Ton</label>
    </div>
  </div>
  <script src="js/wuerfel3d.js?v=1"></script>
  <script>
    (function () {
      var $ = function (s) { return document.querySelector(s); }, brett = $("#brett"), erg = $("#ergebnis");
      var NAMEN = { standard: "Standard", w_obsidian: "Obsidian", w_elfenbein: "Elfenbein", w_smaragd: "Smaragd", w_rubin: "Rubin", w_glut: "Glut", w_frost: "Frost", w_arkan: "Arkan", w_gold: "Gold" };
      $("#design").innerHTML = Object.keys(window.W3D.DESIGNS).map(function (k) { return '<option value="' + k + '">' + (NAMEN[k] || k.replace("w_s0_", "Saison 0 · ")) + "</option>"; }).join("");
      /* Ton: Wurfgeräusch aus dem Spiel, Aufsprünge und Glanzmomente erzeugt */
      var ac = null, wurfTon = [1, 2, 3, 4].map(function (n) { var a = new Audio("ton/fx/wuerfel" + n + ".mp3"); a.preload = "auto"; return a; });
      function pieps(freq, dauer, laut, art, verzug) { if (!ac) return; var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + (verzug || 0); o.type = art || "sine"; o.frequency.setValueAtTime(freq, t); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(laut, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dauer); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dauer + 0.02); }
      window.W3D.ton = function (name, laut) {
        if (!$("#ton").checked || !ac) return;
        if (name === "auf") pieps(170 + Math.random() * 60, 0.07, 0.25 * laut, "triangle");
        if (name === "liegt") pieps(120, 0.1, 0.3, "triangle");
        if (name === "krit") { pieps(880, 0.5, 0.2, "sine"); pieps(1320, 0.6, 0.16, "sine", 0.09); pieps(1760, 0.8, 0.12, "sine", 0.18); }
        if (name === "patzer") { pieps(90, 0.5, 0.4, "sawtooth"); pieps(70, 0.6, 0.3, "sawtooth", 0.12); }
      };
      var RK = 14, BONUS = 5, laeuft = false;
      function zeige(zahl, zusatz) {
        var summe = zahl + BONUS, trifft = zahl === 20 || (zahl !== 1 && summe >= RK), kl = zahl === 20 ? "krit" : zahl === 1 ? "patzer" : trifft ? "" : "fehl";
        erg.className = "ergebnis da " + kl;
        erg.innerHTML = "<b>" + (zahl === 20 ? "Kritischer Treffer!" : zahl === 1 ? "Patzer" : trifft ? "Treffer" : "Verfehlt") + "</b><span>" + (zusatz || "") + "W20 " + zahl + " + " + BONUS + " = " + summe + " gegen RK " + RK + "</span>";
        if (zahl === 20 || zahl === 1) { brett.classList.remove("wackel"); void brett.offsetWidth; brett.classList.add("wackel"); }
      }
      function w20() { return 1 + Math.floor(Math.random() * 20); }
      function wurf(art, ziel, von) {
        if (laeuft) return; laeuft = true; erg.classList.remove("da"); $("#tipp").hidden = true;
        if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
        if ($("#ton").checked) { try { var a = wurfTon[Math.floor(Math.random() * 4)]; a.currentTime = 0; a.volume = 0.6; a.play().catch(function () {}); } catch (e) {} }
        var r = brett.getBoundingClientRect(), o = { design: $("#design").value, schnell: $("#schnell").checked, ziel: ziel || { x: r.left + r.width / 2, y: r.top + r.height * 0.5 }, von: von };
        if (art === "vorteil" || art === "nachteil") { o.zahl = w20(); o.zweite = w20(); o.zaehlt = art === "vorteil" ? "hoch" : "tief"; }
        else o.zahl = art === "zufall" ? w20() : +art;
        window.W3D.wurf(o).then(function (z) { zeige(z, o.zweite != null ? (art === "vorteil" ? "Vorteil: " : "Nachteil: ") + o.zahl + " und " + o.zweite + " · " : ""); laeuft = false; });
      }
      document.querySelectorAll("[data-w]").forEach(function (b) { b.onclick = function () { wurf(b.dataset.w); }; });
      /* Tippen oder Wischen auf der Karte: der Würfel fliegt vom Startpunkt des Wischs zum Endpunkt */
      var ab = null;
      brett.addEventListener("pointerdown", function (e) { ab = { x: e.clientX, y: e.clientY }; });
      brett.addEventListener("pointerup", function (e) {
        if (!ab) return; var dx = e.clientX - ab.x, dy = e.clientY - ab.y, weit = Math.hypot(dx, dy), r = brett.getBoundingClientRect();
        if (weit < 14) wurf("zufall", { x: e.clientX, y: e.clientY });
        else { var f = Math.min(2.2, 160 / weit + 1), zx = Math.max(r.left + 60, Math.min(r.right - 60, ab.x + dx * f)), zy = Math.max(r.top + 70, Math.min(r.bottom - 90, ab.y + dy * f)); wurf("zufall", { x: zx, y: zy }, { x: ab.x - dx * 1.5, y: ab.y - dy * 1.5 }); }
        ab = null;
      });
    })();
  </script>
</body>
</html>
