<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="mythara.webmanifest?v=mwyvn54g">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Riftmere">
  <link rel="apple-touch-icon" href="../img/app/mythara-180.png">
  <title>Riftmere – Dein Held</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../img/favicon.png" type="image/png">
  <link rel="stylesheet" href="../UI/mythara-ui.css">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; min-height: 100%; }
    body { background: radial-gradient(ellipse at 50% 30%, rgba(40,30,18,.55), rgba(8,6,4,.92) 75%), url(../img/echtzeit/waldmark.webp) center / cover fixed, #0b0906; color: var(--mu-text); font: 15px/1.45 Georgia, serif; }
    .seite { max-width: 1180px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 18px 32px; }
    h1 { margin: 6px 0 4px; text-align: center; font: 700 clamp(24px, 3.4vw, 34px)/1.1 var(--mu-schrift); letter-spacing: .08em; background: linear-gradient(180deg, #fff1bf, #d6ac52 55%, #8a6224); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .unter { margin: 0 0 14px; text-align: center; color: var(--mu-text-matt); }
    .schritte { display: flex; justify-content: center; gap: 10px; margin: 0 0 18px; font: 600 13px var(--mu-schrift); letter-spacing: .06em; text-transform: uppercase; color: var(--mu-text-matt); }
    .schritte b { padding: 4px 12px; border-radius: 999px; border: 1px solid #5a4528; } .schritte b.an { color: var(--mu-text-hell); border-color: #d6ac52; box-shadow: 0 0 10px rgba(255,190,80,.35); }
    .bereich { display: grid; grid-template-columns: minmax(300px, 1.1fr) minmax(300px, 1fr); gap: 26px; align-items: start; }
    @media (max-width: 820px) { .bereich { grid-template-columns: 1fr; } }
    .mu-tafel { padding: 22px 20px; }
    .vorschau { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: end; }
    .nah { position: relative; aspect-ratio: 1; border-radius: 14px; background: radial-gradient(circle at 50% 42%, #4a3c2c, #18120c 72%); box-shadow: inset 0 0 40px #000, 0 0 0 1px #000, 0 0 0 3px #8a6224; cursor: grab; touch-action: none; }
    .nah canvas { width: 100%; height: 100%; display: block; }
    .nah small { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 12px; color: var(--mu-text-matt); pointer-events: none; }
    .ganz { width: 150px; height: 190px; border-radius: 10px; background: radial-gradient(ellipse at 50% 85%, rgba(255,210,120,.16), transparent 60%); }
    @media (max-width: 520px) { .ganz { width: 96px; height: 130px; } }
    .drehen { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 12px; }
    .drehen .mu-slot { --mu-g: 44px; font: 700 20px/1 Georgia, serif; }
    .feld { margin: 0 0 16px; } .feld > b { display: block; margin-bottom: 8px; font: 600 12px var(--mu-schrift); letter-spacing: .07em; text-transform: uppercase; color: var(--mu-m1); }
    .zwei { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .zwei .mu-eintrag { justify-content: center; padding-left: 26px; }
    .pfeile { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
    .pfeile .mu-slot { --mu-g: 40px; font: 700 18px/1 Georgia, serif; }
    .pfeile span { text-align: center; font: 600 15px var(--mu-schrift); color: var(--mu-text-hell); }
    .farben { display: flex; flex-wrap: wrap; gap: 10px; }
    .farbe { --mu-g: 38px; } .farbe::after { inset: calc(var(--mu-g) * .2); background: var(--f); box-shadow: inset 0 0 0 1px #000, inset 0 -3px 6px rgba(0,0,0,.35); }
    .farbname { margin-top: 6px; font-size: 13px; color: var(--mu-text-matt); }
    .los { width: 100%; height: 50px; margin-top: 10px; border: 0; cursor: pointer; font: 700 15px var(--mu-schrift); letter-spacing: .1em; text-transform: uppercase; color: #2a1804; border-radius: 999px;
      background: linear-gradient(#fff0b8, #e2b04a 55%, #a8741e); box-shadow: 0 0 0 1px #000, 0 0 0 3px #6e4c1a, 0 0 0 4px #000, 0 6px 16px rgba(0,0,0,.6); }
    .los:hover { filter: brightness(1.08); } .los:disabled { filter: grayscale(.7) brightness(.7); cursor: wait; }
    .zurueck { display: block; margin: 12px auto 0; background: none; border: 0; color: var(--mu-text-matt); font: 14px Georgia, serif; cursor: pointer; text-decoration: underline; }
    .waffen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    @media (max-width: 760px) { .waffen { grid-template-columns: 1fr; } }
    .waffe { display: grid; justify-items: center; gap: 8px; padding: 18px 14px 16px; border: 0; cursor: pointer; color: var(--mu-text); text-align: center; font: inherit; }
    .waffe canvas { width: 170px; height: 210px; }
    .waffe h3 { margin: 0; font: 700 17px var(--mu-schrift); color: var(--mu-m1); } .waffe em { font-style: normal; font: 600 12px var(--mu-schrift); letter-spacing: .08em; text-transform: uppercase; color: var(--mu-text-matt); }
    .waffe p { margin: 0; font-size: 14px; color: var(--mu-text-matt); }
    .waffe.ist-gewaehlt { box-shadow: 0 0 0 1px #000, 0 0 0 3px #ffc04a, 0 0 0 4px #000, 0 0 24px rgba(255,180,60,.5), inset 0 0 30px rgba(255,170,50,.12); }
    .meldung { min-height: 1.3em; margin: 10px 0 0; text-align: center; color: #ffb08a; }
    /* Handy und kleines Tablet im Querformat (ab hier spielt Mythara quer): alles auf eine Bildschirmhöhe – Gesicht links, Auswahl rechts zum Scrollen */
    @media (orientation: landscape) and (max-height: 520px) {
      .seite { max-width: none; padding: max(6px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 6px max(12px, env(safe-area-inset-left)); }
      h1 { margin: 0 0 2px; font-size: 18px; } .unter { display: none; } .schritte { margin: 0 0 6px; gap: 6px; font-size: 10.5px; } .schritte b { padding: 2px 9px; }
      .bereich { grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: stretch; }
      .mu-tafel { padding: 10px 12px; }
      .bereich > .mu-tafel:last-child { max-height: calc(100dvh - 62px); overflow-y: auto; -webkit-overflow-scrolling: touch; }
      .vorschau { grid-template-columns: auto; } .nah { height: calc(100dvh - 128px); width: auto; } .ganz { display: none; }
      .drehen { margin-top: 6px; gap: 8px; } .drehen .mu-slot { --mu-g: 34px; font-size: 16px; } .drehen .mu-plakette { min-width: 90px !important; }
      .feld { margin: 0 0 9px; } .feld > b { margin-bottom: 5px; font-size: 10.5px; }
      .pfeile .mu-slot { --mu-g: 32px; font-size: 15px; } .pfeile span { font-size: 13.5px; } .zwei { gap: 8px; }
      .farbe { --mu-g: 32px; } .farben { gap: 7px; } .farbname { margin-top: 3px; font-size: 12px; }
      .los { height: 40px; margin-top: 4px; font-size: 13px; }
      .waffen { grid-template-columns: repeat(3, 1fr); gap: 10px; } .waffe { padding: 8px 8px 10px; gap: 4px; } .waffe canvas { width: 100px; height: 124px; }
      .waffe h3 { font-size: 14px; } .waffe p { font-size: 12px; line-height: 1.3; } .meldung { margin-top: 4px; } .zurueck { margin-top: 6px; }
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="seite">
    <h1>Erschaffe deinen Helden</h1>
    <p class="unter">Ein Held für die ganze Reise durch die Splitterlande.</p>
    <div class="schritte" aria-hidden="true"><b id="s1" class="an">1 · Aussehen</b><b id="s2">2 · Startwaffe</b></div>

    <section id="schritt1" class="bereich" aria-label="Aussehen">
      <div class="mu-tafel mu-schlicht">
        <div class="vorschau">
          <div class="nah" id="nah" role="img" aria-label="Nahansicht des Gesichts"><canvas id="nahbild" width="768" height="768"></canvas><small>Ziehen zum Drehen</small></div>
          <canvas class="ganz" id="ganzbild" width="300" height="380" role="img" aria-label="Ganze Figur"></canvas>
        </div>
        <div class="drehen"><button class="mu-slot" id="links" aria-label="Nach links drehen">⟲</button><span class="mu-plakette mu-dunkel" id="richtung" style="--mu-g:32px;min-width:120px">Vorn</span><button class="mu-slot" id="rechts" aria-label="Nach rechts drehen">⟳</button></div>
      </div>
      <div class="mu-tafel">
        <div class="feld"><b>Geschlecht</b><div class="zwei"><button class="mu-eintrag" data-g="mann">Männlich</button><button class="mu-eintrag" data-g="frau">Weiblich</button></div></div>
        <div class="feld"><b>Frisur</b><div class="pfeile"><button class="mu-slot" data-wahl="frisur" data-d="-1" aria-label="Vorige Frisur">◀</button><span id="frisur">–</span><button class="mu-slot" data-wahl="frisur" data-d="1" aria-label="Nächste Frisur">▶</button></div></div>
        <div class="feld" id="bartfeld"><b>Bart</b><div class="pfeile"><button class="mu-slot" data-wahl="bart" data-d="-1" aria-label="Voriger Bart">◀</button><span id="bart">–</span><button class="mu-slot" data-wahl="bart" data-d="1" aria-label="Nächster Bart">▶</button></div></div>
        <div class="feld"><b>Haarfarbe</b><div class="farben" id="haar"></div><div class="farbname" id="haarname"></div></div>
        <div class="feld"><b>Hautfarbe</b><div class="farben" id="haut"></div><div class="farbname" id="hautname"></div></div>
        <button class="los" id="weiter">Weiter zur Startwaffe</button>
      </div>
    </section>

    <section id="schritt2" hidden aria-label="Startwaffe">
      <div class="waffen" id="waffen"></div>
      <div style="max-width:420px;margin:18px auto 0">
        <button class="los" id="beginnen">Abenteuer beginnen</button>
        <p class="meldung" id="meldung" role="status"></p>
        <button class="zurueck" id="zurueck">Zurück zum Aussehen</button>
      </div>
    </section>
  </main>
  <script src="../vendor/supabase-js-2.45.4.js"></script>
  <script src="../verbindung.js"></script>
  <script src="held.js?v=mwyvn54g"></script>
</body>
</html>
