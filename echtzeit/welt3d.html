<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mythara 3D – Prototyp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500&display=swap">
<style>
  /* 3D-Prototyp der Welt: Spielfläche über den ganzen Bildschirm, oben links der Ort, unten die Steuerung. Bewusst dunkel wie das Spiel. */
  :root { --rinde: #24180e; --rinde-hell: #3a2817; --gold: #d6b066; --gold-hell: #f3d895; --pergament: #efe5cf; color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body { background: #0b0e09; color: var(--pergament); font-family: Inter, system-ui, sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; }
  #ez-feld { position: fixed; inset: 0; touch-action: none; } #ez-feld canvas { display: block; }
  .tafel { background: linear-gradient(180deg, var(--rinde-hell), var(--rinde)); border: 1px solid color-mix(in srgb, var(--gold) 70%, transparent); border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.55); }
  #ez-ort { position: fixed; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 12px); left: max(16px, env(safe-area-inset-left, 0px)); padding: 8px 14px 9px; max-width: calc(100vw - 32px); }
  #ez-ort b { display: block; font: 600 clamp(17px, 2.4vw, 23px)/1.15 Cinzel, Georgia, serif; color: var(--gold-hell); letter-spacing: .04em; }
  #ez-ort small { display: block; margin-top: 2px; font: italic 500 15px/1.2 "Cormorant Garamond", Georgia, serif; opacity: .8; }
  #ez-ort i { display: block; margin-top: 4px; font: 500 11px/1.2 Inter, sans-serif; font-style: normal; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
  #ez-rechts { position: fixed; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 12px); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  #ez-rechts a, #ez-rechts button { font: 600 12px/1 Cinzel, Georgia, serif; letter-spacing: .06em; color: var(--pergament); text-decoration: none; padding: 9px 12px; cursor: pointer; }
  #ez-rechts a:hover, #ez-rechts button:hover { border-color: var(--gold); }
  #ez-fps { font: 500 11px/1 Inter, sans-serif; color: color-mix(in srgb, var(--pergament) 70%, transparent); text-shadow: 0 1px 2px #000; }
  #ez-hilfe { position: fixed; z-index: 5; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); transform: translateX(-50%); padding: 8px 14px; font-size: 12.5px; line-height: 1.4; text-align: center; max-width: calc(100vw - 32px); }
  #ez-lade { position: fixed; inset: 0; display: grid; place-items: center; font: 600 18px Cinzel, Georgia, serif; color: var(--gold-hell); background: #0b0e09; z-index: 9; }
  @media (pointer: coarse) { .maus { display: none; } } @media (pointer: fine) { .finger { display: none; } }
</style>
</head>
<body>
<div id="ez-feld"></div>
<div id="ez-ort" class="tafel"><b>Waldmark</b><small>Die Zuflucht der Wanderer</small><i>3D-Prototyp</i></div>
<div id="ez-rechts"><a class="tafel" href="./?welt=1">Zur 2D-Welt</a><button type="button" class="tafel" id="ez-schatten">Schatten</button><span id="ez-fps"></span></div>
<div id="ez-hilfe" class="tafel"><span class="maus">Klick: hingehen · WASD: laufen · Pfeiltasten, Q/E oder rechte Maustaste ziehen: Kamera drehen · Mausrad: Zoom</span><span class="finger">Tippen: hingehen · Ziehen: Kamera drehen · Zwei Finger: Zoom</span></div>
<div id="ez-lade">Lade …</div>
<script src="welt3d.js?v=mwyom7gx"></script>
</body>
</html>
