    /* Vorhang: Start- und Ladebildschirm im Stil des Spiels (verschwommene Waldmark, schwebender Seelensplitter, goldene Schrift) */
    .vorhang { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; color: #efe2c4; text-align: center; transition: opacity .5s;
      background: radial-gradient(ellipse at 50% 45%, rgba(10,14,28,.15), rgba(4,3,8,.92) 75%), url("../img/echtzeit/laden-hg.webp") center / cover no-repeat, #07060b; }
    .vorhang[hidden] { display: none; } .vorhang.weg { opacity: 0; pointer-events: none; }
    .vorhang .mitte { width: min(460px, 100%); display: grid; justify-items: center; }
    .vorhang .kristall { position: relative; width: 120px; height: 150px; margin-bottom: 18px; animation: ezSchweben 3.2s ease-in-out infinite; }
    .vorhang .kristall::before { content: ""; position: absolute; inset: 18px 30px; clip-path: polygon(50% 0, 100% 38%, 72% 100%, 28% 100%, 0 38%); background: linear-gradient(160deg, #f4fdff 0%, #8fd8ff 35%, #3d7fc0 70%, #1d3a6a 100%); filter: drop-shadow(0 0 14px rgba(143,216,255,.9)); animation: ezGluehen 2.4s ease-in-out infinite; }
    .vorhang .kristall::after { content: ""; position: absolute; inset: 18px 30px; clip-path: polygon(50% 0, 64% 38%, 50% 100%, 36% 38%); background: linear-gradient(rgba(255,255,255,.85), rgba(255,255,255,0)); }
    .vorhang .kristall i { position: absolute; left: 50%; top: 50%; width: 150px; height: 150px; margin: -75px; border-radius: 50%; border: 1px dashed rgba(240,212,138,.55); animation: ezDrehen 14s linear infinite; }
    .vorhang .kristall i::before, .vorhang .kristall i::after { content: ""; position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #f0d48a; box-shadow: 0 0 10px #f0d48a; top: -4px; left: calc(50% - 4px); }
    .vorhang .kristall i::after { top: auto; bottom: -4px; background: #8fd8ff; box-shadow: 0 0 10px #8fd8ff; }
    .vorhang h1 { margin: 0; font: 600 clamp(26px, 6vw, 40px) Cinzel, Georgia, serif; letter-spacing: .14em; text-transform: uppercase; color: #f0d48a; text-shadow: 0 2px 0 #3a2400, 0 0 24px rgba(240,212,138,.35); }
    .vorhang .zier { height: 1px; margin: 12px auto 14px; width: 70%; background: linear-gradient(90deg, transparent, #b08a3c, #f0d48a, #b08a3c, transparent); position: relative; }
    .vorhang .zier::after { content: "◆"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -54%); font-size: 10px; color: #f0d48a; }
    .vorhang .was, .vorhang .zeit { margin: 0 0 8px; font: 600 15px Inter, sans-serif; color: #fff3d2; letter-spacing: .03em; }
    .vorhang .was::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: ezPunkte 1.6s steps(4) infinite; }
    .vorhang .tipp { margin: 4px 0 0; min-height: 3em; max-width: 400px; font: italic 400 17px/1.4 "Cormorant Garamond", Georgia, serif; color: #cdb98a; }
    .vorhang .balken { width: 100%; height: 8px; margin: 4px 0 10px; border: 1px solid #5d4517; border-radius: 4px; background: rgba(0,0,0,.55); overflow: hidden; }
    .vorhang .balken i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #4a7fb0, #8fd8ff, #e8fbff); box-shadow: 0 0 10px #8fd8ff; transition: width .9s ease; }

    @keyframes ezGluehen { 0%, 100% { filter: drop-shadow(0 0 10px rgba(143,216,255,.7)); } 50% { filter: drop-shadow(0 0 26px rgba(143,216,255,1)); } }
    @keyframes ezDrehen { to { transform: rotate(360deg); } }
