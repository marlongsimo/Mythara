<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="mythara.webmanifest?v=mwvp78rp">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mythara">
  <link rel="apple-touch-icon" href="../img/app/mythara-180.png">
  <title>Mythara: Splitterlande – Anmelden</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../img/favicon.png" type="image/png">
  <link rel="stylesheet" href="start.css?v=mwvp78rp">
  <script src="start-passen.js?v=mwvp78rp"></script>
  <script src="quer.js?v=mwvp78rp" defer></script>
  <style>
    /* Login-Fenster: quer, unter dem Logo im Hintergrund */
    .login { width: min(620px, 94vw); padding: 64px clamp(22px, 6vw, 64px) 34px; display: flex; flex-direction: column; gap: 16px; }
    .login h1 { margin: 0 0 4px; text-align: center; font: 600 20px/1.2 var(--titel); letter-spacing: .08em; color: var(--gold); }
    .login .knopf.haupt { width: 100%; margin-top: 6px; }
    .login .zeile { display: flex; justify-content: center; }
    .login .wege { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 6px; }
    .login .hinweis { margin: 0; text-align: center; font: 400 16px/1.35 var(--schrift); color: var(--leise); }
    .login .name-info { margin: -8px 0 0 4px; font: 400 15px/1.3 var(--schrift); color: var(--leise); } .login .name-info[data-art="fehler"] { color: #ff9a8a; } .login .name-info[data-art="ok"] { color: #a9e08a; }
    @media (max-height: 880px) and (min-aspect-ratio: 1/1) { .logo-platz { height: 22vh; } .login { padding-top: 50px; gap: 12px; } .feld { height: 48px; } .knopf { height: 54px; } }
  </style>
</head>
<body>
  <main class="buehne">
    <div class="logo-platz" aria-hidden="true"></div>
    <div class="logo-text" aria-hidden="true"><b>MYTHARA</b><small>— SPLITTERLANDE —</small></div>
    <section class="tafel login" aria-labelledby="titel">
      <i class="emblem"></i><i class="ranke lo"></i><i class="ranke ro"></i><i class="ranke lu"></i><i class="ranke ru"></i>
      <h1 id="titel">Anmelden</h1>
      <div id="inhalt"></div>
      <p class="meldung" id="meldung" role="status"></p>
    </section>
    <p class="fuss"><a href="../">← Zur Startseite von Mythara</a> · <a href="https://case-unlocked.de/impressum.html" target="_blank" rel="noopener">Impressum</a> · <a href="https://case-unlocked.de/datenschutz.html" target="_blank" rel="noopener">Datenschutz</a></p>
  </main>
  <script src="../vendor/supabase-js-2.45.4.js"></script>
  <script src="../verbindung.js"></script>
  <script>
  /* Login der Splitterlande (24.11.2026). Gleiche Kontofunktionen wie bisher (Datenbank, Anmelde-Speicher „mr-rpg-auth“, Konto auch fürs Würfelspiel).
     Nach Anmelden, Registrieren oder „Als Gast“ geht es immer zuerst auf die Landing-Page (willkommen.html), von dort ins Spiel.
     Wer schon angemeldet ist, landet direkt dort. „Angemeldet bleiben“ aus: Die Anmeldung endet, wenn der Browser geschlossen wird. */
  (() => {
    "use strict";
    const $ = (s) => document.querySelector(s), NAME = /^[A-Za-z0-9_ÄÖÜäöüß]{3,20}$/;
    const ICO = { person: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8z"/></svg>',
      schloss: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10h14v11H5z"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="#d9b25f" stroke-width="2"/></svg>',
      auge: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3.2" fill="#0f0d0c"/></svg>' };
    const feld = (id, ico, typ, platz, auto, extra = "") => `<label class="feld">${ICO[ico]}<input type="${typ}" id="${id}" autocomplete="${auto}" placeholder="${platz}" aria-label="${platz}" ${extra}>${typ === "password" ? `<button type="button" class="auge" data-auge="${id}" aria-label="Passwort anzeigen">${ICO.auge}</button>` : ""}</label>`;
    const fb = (t, art = "") => { const e = $("#meldung"); e.textContent = t; e.dataset.art = art; };
    const lies = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, schreib = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { /* privat */ } };
    const weiter = () => { const w = new URLSearchParams(location.search).get("weiter") || ""; return /^\?[A-Za-z0-9_=&%.\-]*$/.test(w) ? w : ""; };
    const zurLandung = () => { try { sessionStorage.setItem("mr-sitzung", "1"); } catch (e) { /* privat */ } location.replace("willkommen.html" + (weiter() ? "?weiter=" + encodeURIComponent(weiter()) : "")); };
    let db = null; const c = window.MR_MULTIPLAYER_CONFIG;
    try { if (window.supabase && c) db = window.supabase.createClient(c.supabaseUrl, c.supabasePublishableKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: "mr-rpg-auth" } }); } catch (e) { db = null; }
    const rpc = async (fn, args) => { const { data, error } = await db.rpc(fn, args); if (error) throw new Error(error.message); return data; };
    const gast = async () => { const { data } = await db.auth.getSession(); if (!data.session) { const r = await db.auth.signInAnonymously(); if (r.error) throw new Error(r.error.message); } };
    const merken = () => { const an = $("#merken") ? $("#merken").checked : true; schreib("mr-merken", an ? null : "0"); };
    let ansicht = "anmelden";

    async function anmelden() {
      const name = $("#name").value.trim(), pw = $("#pw").value; if (!name || !pw) return fb("Bitte Benutzername und Passwort eingeben.", "fehler");
      const knopf = $("#los"); knopf.disabled = true; fb("Anmeldung …");
      try { await gast(); const adresse = NAME.test(name) ? await rpc("rpg_login_email", { p_handle: name }) : null; if (!adresse) throw new Error("Benutzername oder Passwort ist falsch.");
        const { error } = await db.auth.signInWithPassword({ email: adresse, password: pw }); if (error) throw new Error(/invalid/i.test(error.message) ? "Benutzername oder Passwort ist falsch." : error.message);
        merken(); zurLandung();
      } catch (e) { fb(e.message, "fehler"); knopf.disabled = false; }
    }
    async function registrieren() {
      const name = $("#reg-name").value.trim(), pw = $("#reg-pw").value, pw2 = $("#reg-pw2").value;
      if (!NAME.test(name)) return fb("Der Benutzername braucht 3–20 Zeichen: Buchstaben, Ziffern oder _.", "fehler"); if (pw.length < 8) return fb("Das Passwort braucht mindestens 8 Zeichen.", "fehler"); if (pw !== pw2) return fb("Die beiden Passwörter stimmen nicht überein.", "fehler");
      const knopf = $("#los"); knopf.disabled = true; fb("Konto wird erstellt …");
      try { await gast(); const p = await rpc("rpg_set_profile", { p_handle: name });
        const { error } = await db.auth.updateUser({ email: p.anmeldung, password: pw });
        if (error) throw new Error(/password/i.test(error.message) && /weak|short|least/i.test(error.message) ? "Dieses Passwort ist zu schwach. Bitte ein längeres wählen." : error.message);
        merken(); zurLandung();
      } catch (e) { fb(e.message, "fehler"); knopf.disabled = false; }
    }
    async function alsGast() { fb("Einen Moment …"); try { if (db) await gast(); } catch (e) { /* ohne Datenbank: trotzdem als Gast */ } schreib("mr-merken", null); try { sessionStorage.setItem("mr-gast", "1"); } catch (e) { /* privat */ } zurLandung(); }

    function zeichnen() {
      const el = $("#inhalt"); fb("");
      if (ansicht === "registrieren") { $("#titel").textContent = "Konto erstellen";
        el.innerHTML = `<form id="form" class="login-form" novalidate style="display:flex;flex-direction:column;gap:16px">
            ${feld("reg-name", "person", "text", "Benutzername", "username", 'maxlength="20" autocapitalize="off" spellcheck="false"')}
            <p class="name-info" id="name-info">3–20 Zeichen: Buchstaben, Ziffern oder _. Diesen Namen sehen deine Mitspieler.</p>
            ${feld("reg-pw", "schloss", "password", "Passwort (mind. 8 Zeichen)", "new-password", 'minlength="8"')}
            ${feld("reg-pw2", "schloss", "password", "Passwort wiederholen", "new-password")}
            <div class="zeile"><label class="haken"><input type="checkbox" id="merken" checked> Angemeldet bleiben</label></div>
            <button class="knopf haupt" id="los" type="submit">Konto erstellen</button>
            <p class="hinweis">Merke dir dein Passwort gut: Ohne hinterlegte E-Mail kann es nicht zurückgesetzt werden. Das Konto gilt auch für das Würfelspiel.</p>
            <div class="wege"><button class="knopf dunkel" type="button" id="zurueck">Ich habe schon ein Konto</button></div></form>`;
        let takt = null;
        $("#reg-name").addEventListener("input", (e) => { const v = e.target.value.trim(), info = $("#name-info"); clearTimeout(takt);
          if (!v) { info.textContent = "3–20 Zeichen: Buchstaben, Ziffern oder _. Diesen Namen sehen deine Mitspieler."; info.dataset.art = ""; return; }
          if (!NAME.test(v)) { info.textContent = "Nur 3–20 Zeichen: Buchstaben, Ziffern oder _ (keine Leerzeichen)."; info.dataset.art = "fehler"; return; }
          info.textContent = "Wird geprüft …"; info.dataset.art = "";
          takt = setTimeout(async () => { try { await gast(); const r = await rpc("rpg_handle_frei", { p_handle: v }); if ($("#reg-name").value.trim() !== v) return;
              info.textContent = r === "frei" ? `✓ „${v}“ ist frei.` : r === "gesperrt" ? "Dieser Name ist nicht erlaubt." : r === "vergeben" ? `„${v}“ ist schon vergeben.` : "Ungültiger Name."; info.dataset.art = r === "frei" ? "ok" : "fehler";
            } catch (err) { info.textContent = err.message; info.dataset.art = "fehler"; } }, 350); });
        $("#form").onsubmit = (e) => { e.preventDefault(); registrieren(); }; $("#zurueck").onclick = () => { ansicht = "anmelden"; zeichnen(); $("#name").focus(); };
      } else { $("#titel").textContent = "Anmelden";
        el.innerHTML = `<form id="form" novalidate style="display:flex;flex-direction:column;gap:16px">
            ${feld("name", "person", "text", "Benutzername", "username", 'maxlength="20" autocapitalize="off" spellcheck="false"')}
            ${feld("pw", "schloss", "password", "Passwort", "current-password")}
            <button class="knopf haupt" id="los" type="submit">Einloggen</button>
            <div class="zeile"><label class="haken"><input type="checkbox" id="merken" checked> Angemeldet bleiben</label></div>
            <div class="wege"><button class="knopf dunkel" type="button" id="reg">Registrieren</button><button class="knopf dunkel" type="button" id="gast">Als Gast spielen</button></div>
            <div class="zeile"><button class="link" type="button" id="vergessen">Passwort vergessen?</button></div></form>`;
        $("#form").onsubmit = (e) => { e.preventDefault(); anmelden(); };
        $("#reg").onclick = () => { ansicht = "registrieren"; zeichnen(); $("#reg-name").focus(); };
        $("#gast").onclick = alsGast;
        $("#vergessen").onclick = () => fb("Ohne hinterlegte E-Mail lässt sich das Passwort leider nicht zurücksetzen. Eine E-Mail im Konto zu hinterlegen, wird später möglich.");
      }
      el.querySelectorAll("[data-auge]").forEach((b) => { b.onclick = () => { const i = $("#" + b.dataset.auge); i.type = i.type === "password" ? "text" : "password"; }; });
      if (!db) fb("Die Anmeldung ist gerade nicht erreichbar. Du kannst als Gast spielen.", "fehler");
    }
    zeichnen();
    /* „Angemeldet bleiben“ war aus und der Browser wurde geschlossen: abmelden. Sonst gilt: wer angemeldet ist, kommt direkt auf die Landing-Page. */
    if (db) (async () => { let sitzung = false; try { sitzung = sessionStorage.getItem("mr-sitzung") === "1"; } catch (e) { /* privat */ }
      const { data } = await db.auth.getSession();
      if (data.session && lies("mr-merken") === "0" && !sitzung) { await db.auth.signOut(); schreib("mr-merken", null); return; }
      if (data.session && !data.session.user.is_anonymous) zurLandung(); })().catch(() => {});
  })();
  </script>
</body>
</html>
