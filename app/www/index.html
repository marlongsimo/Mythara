<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Riftmere</title>
  <link rel="stylesheet" href="start.css">
  <script src="start-passen.js"></script>
    <style>
    /* Login-Fenster: quer, unter dem Logo im Hintergrund */
    .login { width: min(620px, 94vw); padding: 64px clamp(22px, 6vw, 64px) 34px; display: flex; flex-direction: column; gap: 16px; }
    .login h1 { margin: 0 0 4px; text-align: center; font: 600 20px/1.2 var(--titel); letter-spacing: .08em; color: var(--gold); }
    .login .knopf.haupt { width: 100%; margin-top: 6px; }
    .login .zeile { display: flex; justify-content: center; }
    .login .wege { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 6px; }
    .login .hinweis { margin: 0; text-align: center; font: 400 16px/1.35 var(--schrift); color: var(--leise); }
    .login .name-info { margin: -8px 0 0 4px; font: 400 15px/1.3 var(--schrift); color: var(--leise); } .login .name-info[data-art="fehler"] { color: #ff9a8a; } .login .name-info[data-art="ok"] { color: #a9e08a; }
    @media (max-height: 880px) and (min-aspect-ratio: 1/1) { .logo-platz { height: 22vh; } .login { padding-top: 50px; gap: 12px; } .feld { height: 48px; } .knopf { height: 54px; } }
  </style>
  <style>
    /* Eingebaute Startseite der App: sieht aus wie die Anmeldung auf riftmere.de. Mit Internet geht es sofort zur echten Anmeldung,
       ohne Internet bleibt diese Seite stehen (Felder gesperrt) und es geht von selbst weiter, sobald die Verbindung zurück ist. */
    html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .login.wartet .feld, .login.wartet .wege, .login.wartet .zeile { opacity: .45; pointer-events: none; }
    .knopf:disabled { cursor: default; }
    .fuss { display: none; }
  </style>
</head>
<body>
  <main class="buehne">
    <div class="logo-platz" aria-hidden="true"></div>
    <section class="tafel login wartet" aria-labelledby="titel">
      <i class="emblem"></i><i class="ranke lo"></i><i class="ranke ro"></i><i class="ranke lu"></i><i class="ranke ru"></i>
      <h1 id="titel">Anmelden</h1>
      <div id="inhalt"><form novalidate style="display:flex;flex-direction:column;gap:16px" onsubmit="return false">
        <label class="feld"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8z"/></svg><input type="text" placeholder="Benutzername" aria-label="Benutzername" disabled></label>
        <label class="feld"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10h14v11H5z"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="#d9b25f" stroke-width="2"/></svg><input type="password" placeholder="Passwort" aria-label="Passwort" disabled></label>
        <button class="knopf haupt" id="los" type="button" disabled>Verbinde …</button>
        <div class="zeile"><label class="haken"><input type="checkbox" checked disabled> Angemeldet bleiben</label></div>
        <div class="wege"><button class="knopf dunkel" type="button" disabled>Registrieren</button><button class="knopf dunkel" type="button" disabled>Als Gast spielen</button></div>
      </form></div>
      <p class="meldung" id="meldung" role="status"></p>
    </section>
    <p class="fuss"></p>
  </main>
  <script>
  (() => {
    "use strict";
    const ZIEL = "https://riftmere.de/echtzeit/anmelden.html?app=ios";
    const $ = (s) => document.querySelector(s); let zeit = 0, weg = false;
    const melden = (t, art) => { const e = $("#meldung"); e.textContent = t; e.dataset.art = art || ""; };
    function offline(text) { $("#los").textContent = "Erneut versuchen"; $("#los").disabled = false; melden(text, "fehler"); clearTimeout(zeit); zeit = setTimeout(pruefen, 5000); }
    async function pruefen() {
      if (weg) return; clearTimeout(zeit); $("#los").disabled = true; $("#los").textContent = "Verbinde …";
      if (!navigator.onLine) return offline("Keine Internetverbindung. Riftmere ist ein Online-Spiel – sobald du wieder online bist, geht es von selbst weiter.");
      try {
        const ab = new AbortController(), t = setTimeout(() => ab.abort(), 8000);
        await fetch(ZIEL.replace("?app=ios", "") + "?t=" + Date.now(), { mode: "no-cors", cache: "no-store", signal: ab.signal }); clearTimeout(t);
        weg = true; location.replace(ZIEL);   /* erreichbar: zur echten Anmeldung (sieht genauso aus) */
      } catch (e) { offline("Die Splitterlande sind gerade nicht erreichbar. Wir versuchen es gleich noch einmal."); }
    }
    $("#los").onclick = pruefen;
    addEventListener("online", pruefen);
    document.addEventListener("visibilitychange", () => { if (!document.hidden && !weg) pruefen(); });
    addEventListener("pageshow", () => { weg = false; pruefen(); });
  })();
  </script>
</body>
</html>
