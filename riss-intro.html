<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Rissgänger – Mythara</title>
<style>
  @font-face { font-family: "Cinzel"; src: url("fonts/cinzel-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "Cormorant Garamond"; src: url("fonts/cormorant-garamond-latin-400-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
  @font-face { font-family: "Inter"; src: url("fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: swap; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; color: #e9eefc; overflow: hidden; }
  .buehne { position: fixed; inset: 0; display: grid; place-items: center; background: #000; }
  /* Bildfläche im Kinoformat der Clips (552:308), so groß wie der Bildschirm es zulässt */
  .bild { position: relative; width: min(100vw, calc(100vh * 552 / 308)); aspect-ratio: 552 / 308; overflow: hidden; background: #02040a; }
  .szene { position: absolute; inset: 0; opacity: 0; transition: opacity 1.1s ease; }
  .szene.an { opacity: 1; }
  .szene video, .szene img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.04); filter: saturate(1.08) contrast(1.05); }
  .szene.an video, .szene.an img { animation: fahrt var(--dauer, 5s) ease-out forwards; }
  .szene[data-fahrt="rein"] { --von: 1.03; --bis: 1.14; } .szene[data-fahrt="raus"] { --von: 1.14; --bis: 1.03; } .szene[data-fahrt="stoss"] { --von: 1.04; --bis: 1.22; }
  @keyframes fahrt { from { transform: scale(var(--von, 1.04)); } to { transform: scale(var(--bis, 1.12)); } }
  /* Kino: dunkle Ränder, Korn, Balken oben und unten */
  .bild::before { content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none; background: radial-gradient(ellipse at 50% 55%, transparent 45%, rgba(0, 0, 0, .72) 100%); }
  .korn { position: absolute; inset: -50%; z-index: 4; pointer-events: none; opacity: .09; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); animation: korn .6s steps(4) infinite; }
  @keyframes korn { 0% { transform: translate(0, 0); } 25% { transform: translate(-4%, 3%); } 50% { transform: translate(3%, -5%); } 75% { transform: translate(-2%, -3%); } 100% { transform: translate(4%, 4%); } }
  .balken { position: absolute; left: 0; right: 0; height: 9%; background: #000; z-index: 5; } .balken.oben { top: 0; } .balken.unten { bottom: 0; }
  .blitz { position: absolute; inset: 0; z-index: 6; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 55%, #fff, #9fd0ff 40%, #2a6cff 80%); }
  .blitz.an { animation: blitz 1.5s ease-out forwards; }
  @keyframes blitz { 0% { opacity: 0; } 12% { opacity: 1; } 100% { opacity: 0; } }
  /* Text */
  .zeile { position: absolute; left: 6%; right: 6%; bottom: 14%; z-index: 7; margin: 0; text-align: center; font: italic 400 clamp(17px, 3.1vw, 34px)/1.3 "Cormorant Garamond", Georgia, serif; color: #eef3ff; text-shadow: 0 2px 14px #000, 0 0 30px rgba(0, 0, 0, .8); opacity: 0; transform: translateY(8px); transition: opacity .9s ease, transform .9s ease; }
  .zeile.an { opacity: 1; transform: none; }
  .titel { position: absolute; inset: 0; z-index: 8; display: grid; place-content: center; justify-items: center; gap: 1.4vh; text-align: center; opacity: 0; pointer-events: none; transition: opacity 1.4s ease; background: radial-gradient(ellipse at 50% 50%, rgba(4, 10, 28, .45), rgba(0, 0, 0, .9)); }
  .titel.an { opacity: 1; pointer-events: auto; }
  .titel small { font: 600 clamp(10px, 1.3vw, 14px) "Inter", system-ui, sans-serif; letter-spacing: .34em; text-transform: uppercase; color: #9fc4ff; }
  .titel h1 { margin: 0; font: 600 clamp(34px, 8.4vw, 104px)/1 "Cinzel", Georgia, serif; letter-spacing: .08em; color: #f2f6ff; text-shadow: 0 0 26px rgba(80, 150, 255, .9), 0 0 80px rgba(40, 110, 255, .7), 0 4px 18px #000; }
  .titel.an h1 { animation: titel 2.4s ease-out both; }
  @keyframes titel { from { letter-spacing: .32em; opacity: 0; filter: blur(8px); } to { letter-spacing: .08em; opacity: 1; filter: none; } }
  .titel p { margin: 0; font: italic 400 clamp(15px, 2.3vw, 26px) "Cormorant Garamond", Georgia, serif; color: #d6e2ff; }
  .knoepfe { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 2vh; }
  button, a.knopf { font: 600 clamp(13px, 1.5vw, 16px) "Inter", system-ui, sans-serif; letter-spacing: .04em; padding: .7em 1.4em; border-radius: 999px; cursor: pointer; text-decoration: none; color: #eaf2ff; background: rgba(20, 40, 90, .7); border: 1px solid rgba(130, 180, 255, .8); box-shadow: 0 0 22px rgba(60, 130, 255, .35); }
  button:hover, a.knopf:hover, button:focus-visible, a.knopf:focus-visible { background: rgba(40, 80, 170, .85); outline: none; }
  a.knopf.leise, button.leise { background: rgba(0, 0, 0, .45); border-color: rgba(255, 255, 255, .35); box-shadow: none; }
  /* Start */
  .start { position: absolute; inset: 0; z-index: 9; display: grid; place-content: center; justify-items: center; gap: 2.2vh; text-align: center; background: rgba(0, 0, 0, .55); transition: opacity .8s ease; }
  .start.weg { opacity: 0; pointer-events: none; }
  .start b { font: 600 clamp(22px, 4.6vw, 54px) "Cinzel", Georgia, serif; letter-spacing: .12em; text-shadow: 0 0 30px rgba(60, 130, 255, .8); }
  .start label { display: flex; gap: 8px; align-items: center; font: 600 13px "Inter", system-ui, sans-serif; color: #c9d8f5; }
  .ecke { position: absolute; z-index: 10; top: max(10px, env(safe-area-inset-top)); right: 12px; opacity: .0; transition: opacity .4s; }
  .laeuft .ecke { opacity: .75; }
  .ecke button { padding: .45em 1em; font-size: 12px; }
  /* Hochkant: das Bild füllt mehr vom Schirm, die Seiten werden beschnitten (der Riss sitzt in der Mitte) */
  @media (orientation: portrait) { .bild { width: 100vw; aspect-ratio: 4 / 5; } .balken { height: 5%; } .zeile { bottom: 9%; font-size: clamp(18px, 5.4vw, 30px); } }
  @media (prefers-reduced-motion: reduce) { .szene.an video, .szene.an img, .korn, .titel.an h1 { animation: none; } .blitz.an { animation-duration: .01s; } }
</style>
</head>
<body>
<main class="buehne">
  <div class="bild" id="bild">
    <div class="szene" data-fahrt="rein" style="--dauer: 5.2s"><video muted playsinline preload="auto" poster="img/riss/intro-1.jpg"><source src="img/riss/intro-1.mp4" type="video/mp4"><source src="img/riss/intro-1.webm" type="video/webm"></video></div>
    <div class="szene" data-fahrt="rein" style="--dauer: 5.2s"><video muted playsinline preload="auto" poster="img/riss/intro-2.jpg"><source src="img/riss/intro-2.mp4" type="video/mp4"><source src="img/riss/intro-2.webm" type="video/webm"></video></div>
    <div class="szene" data-fahrt="raus" style="--dauer: 4.8s"><video muted playsinline preload="auto" poster="img/riss/intro-3.jpg"><source src="img/riss/intro-3.mp4" type="video/mp4"><source src="img/riss/intro-3.webm" type="video/webm"></video></div>
    <div class="szene" data-fahrt="stoss" style="--dauer: 4.6s"><video muted playsinline preload="auto" poster="img/riss/intro-4.jpg"><source src="img/riss/intro-4.mp4" type="video/mp4"><source src="img/riss/intro-4.webm" type="video/webm"></video></div>
    <div class="korn" aria-hidden="true"></div><div class="blitz" id="blitz" aria-hidden="true"></div>
    <div class="balken oben" aria-hidden="true"></div><div class="balken unten" aria-hidden="true"></div>
    <p class="zeile" id="zeile" aria-live="polite"></p>
    <div class="titel" id="titel"><small>Mythara</small><h1>Rissgänger</h1><p>Zwei Gruppen. Ein Riss. Ein Siegel.</p>
      <div class="knoepfe"><button type="button" id="nochmal">Noch einmal</button><a class="knopf leise" href="spiel.html?riss=1">Zum Spiel</a></div></div>
    <div class="start" id="start"><b>Rissgänger</b><button type="button" id="los">Abspielen</button><label><input type="checkbox" id="ton" checked> mit Musik</label></div>
    <div class="ecke"><button type="button" class="leise" id="skip">Überspringen</button></div>
  </div>
</main>
<audio id="musik" src="ton/intro.mp3" preload="none"></audio>
<script>
(function () {
  "use strict";
  const $ = (s) => document.querySelector(s), szenen = [...document.querySelectorAll(".szene")], zeile = $("#zeile"), musik = $("#musik"), bild = $("#bild");
  /* Ablauf: je Szene ein Clip (einmal, das letzte Bild bleibt stehen), eine Zeile Text, weiche Überblendung zur nächsten */
  const PLAN = [
    { text: "In den Splitterlanden steht eine Ruine, die niemand mehr betritt.", dauer: 4300 },
    { text: "Bis in einer Nacht der Boden zu leuchten beginnt.", dauer: 4500 },
    { text: "Ein Riss öffnet sich.", dauer: 4000 },
    { text: "Wer hineingreift, kommt als Erster ans Siegel – oder gar nicht zurück.", dauer: 3900 }];
  let lauf = 0, uhren = [];
  const spaeter = (fn, ms) => { const n = lauf, t = setTimeout(() => { if (n === lauf) fn(); }, ms); uhren.push(t); return t; };
  function stopp() { lauf++; uhren.forEach(clearTimeout); uhren = []; }
  function leiser(ziel, ms) { const von = musik.volume, t0 = performance.now(), n = lauf; (function schritt(t) { if (n !== lauf && ziel > 0) return; const a = Math.min(1, (t - t0) / ms); musik.volume = Math.max(0, Math.min(1, von + (ziel - von) * a)); if (a < 1) requestAnimationFrame(schritt); else if (ziel === 0) musik.pause(); })(t0); }
  function szene(i) {
    szenen.forEach((s, k) => { if (k !== i) s.classList.remove("an"); });
    const s = szenen[i], v = s.querySelector("video"); s.classList.remove("an"); void s.offsetWidth; s.classList.add("an");
    try { v.currentTime = 0; const p = v.play(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* ohne Video bleibt das Standbild */ }
    zeile.classList.remove("an"); spaeter(() => { zeile.textContent = PLAN[i].text; zeile.classList.add("an"); }, 700);
    spaeter(() => zeile.classList.remove("an"), PLAN[i].dauer - 500);
    spaeter(() => (i + 1 < PLAN.length ? szene(i + 1) : schluss()), PLAN[i].dauer);
  }
  function schluss() {
    zeile.classList.remove("an"); const b = $("#blitz"); b.classList.remove("an"); void b.offsetWidth; b.classList.add("an");
    spaeter(() => { $("#titel").classList.add("an"); bild.classList.remove("laeuft"); }, 350);
    spaeter(() => leiser(0, 5000), 5000);
  }
  function los() {
    stopp(); $("#start").classList.add("weg"); $("#titel").classList.remove("an"); bild.classList.add("laeuft");
    if ($("#ton").checked) { try { musik.currentTime = 0; musik.volume = 0; const p = musik.play(); if (p && p.catch) p.catch(() => {}); leiser(.7, 1800); } catch (e) { /* ohne Ton */ } } else musik.pause();
    spaeter(() => szene(0), 300);
  }
  $("#los").onclick = los; $("#nochmal").onclick = los;
  $("#skip").onclick = () => { stopp(); szenen.forEach((s, k) => s.classList.toggle("an", k === szenen.length - 1)); schluss(); };
  if (new URLSearchParams(location.search).has("ohneton")) $("#ton").checked = false;
})();
</script>
</body>
</html>
