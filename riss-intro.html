<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Rissgänger – Mythara</title>
<style>
  /* Die vier Clips als ein durchgehender Film: ohne Schnitt aneinandergereiht, Zwischenbilder berechnet (img/riss/riss-film.*) */
  html, body { height: 100%; margin: 0; background: #000; }
  main { position: fixed; inset: 0; display: grid; place-items: center; }
  video { width: min(100vw, calc(100vh * 552 / 308)); aspect-ratio: 552 / 308; background: #000; display: block; }
  nav { position: fixed; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; opacity: 0; transition: opacity .4s; }
  main:hover nav, nav:focus-within, nav.an { opacity: .9; }
  button, a { font: 600 13px system-ui, sans-serif; padding: .55em 1.1em; border-radius: 999px; color: #eaf2ff; background: rgba(0, 0, 0, .55); border: 1px solid rgba(255, 255, 255, .4); text-decoration: none; cursor: pointer; }
</style>
</head>
<body>
<main>
  <video id="film" autoplay muted loop playsinline preload="auto" poster="img/riss/riss-film.jpg">
    <source src="img/riss/riss-film.mp4" type="video/mp4"><source src="img/riss/riss-film.webm" type="video/webm">
  </video>
  <nav id="leiste"><button type="button" id="schleife">Schleife: an</button><button type="button" id="neu">Von vorn</button><a href="img/riss/riss-film.gif" download>Als GIF</a><a href="img/riss/riss-film.mp4" download>Als Video</a></nav>
</main>
<script>
(function () {
  const v = document.getElementById("film"), l = document.getElementById("leiste"), s = document.getElementById("schleife");
  s.onclick = () => { v.loop = !v.loop; s.textContent = "Schleife: " + (v.loop ? "an" : "aus"); if (v.loop && v.ended) v.play(); };
  document.getElementById("neu").onclick = () => { v.currentTime = 0; v.play(); };
  v.addEventListener("click", () => l.classList.toggle("an")); // am Handy: Antippen zeigt die Knöpfe
  v.addEventListener("ended", () => l.classList.add("an"));
})();
</script>
</body>
</html>
