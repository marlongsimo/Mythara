<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Mythara – Animationen testen</title>
<style>
  :root { --bg: #1b2028; --tafel: #242b35; --rand: #3a4452; --text: #e9e4d8; --leise: #9aa3ad; --akzent: #d9a54a; }
  * { box-sizing: border-box; } [hidden] { display: none !important; } body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--rand); display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; } header b { color: var(--akzent); } header small { color: var(--leise); }
  main { display: grid; grid-template-columns: minmax(280px, 1fr) 360px; gap: 12px; padding: 12px 16px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .buehne { background: radial-gradient(#4a6b36, #2f4422); border-radius: 10px; min-height: 420px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .buehne canvas { max-width: 100%; max-height: 78vh; } #info { position: absolute; left: 10px; bottom: 8px; color: #e9e4d8cc; font-size: 13px; }
  .feld { background: var(--tafel); border: 1px solid var(--rand); border-radius: 10px; padding: 10px; margin-bottom: 10px; } .feld h3 { margin: 0 0 8px; font-size: 13px; color: var(--leise); text-transform: uppercase; letter-spacing: .05em; }
  select, button, input { font: inherit; } select { width: 100%; padding: 6px; background: #161a21; color: var(--text); border: 1px solid var(--rand); border-radius: 6px; }
  .knoepfe { display: flex; flex-wrap: wrap; gap: 6px; } .knoepfe button { padding: 5px 9px; border-radius: 6px; border: 1px solid var(--rand); background: #161a21; color: var(--text); cursor: pointer; }
  .knoepfe button.an { background: var(--akzent); color: #1b2028; border-color: var(--akzent); } .reihe { display: flex; gap: 8px; align-items: center; margin-top: 6px; } .reihe label { min-width: 92px; color: var(--leise); font-size: 13px; } .reihe input[type=range] { flex: 1; }
  .teil { display: grid; grid-template-columns: 1fr 120px; gap: 6px; margin-bottom: 6px; } .teil .name { font-size: 13px; color: var(--leise); align-self: center; }
</style></head>
<body>
<header><b>Mythara · Animationen testen</b><small>alle 3D-Figuren, Bewegungen und Waffen – nur über diesen Link erreichbar</small></header>
<main>
  <div class="buehne" id="buehne"><canvas id="c"></canvas><div id="info"></div></div>
  <div>
    <div class="feld"><h3>Figur</h3><select id="figur"></select>
      <div class="reihe" id="hautreihe" hidden><label>Haut</label><select id="haut"></select></div></div>
    <div class="feld"><h3>Bewegung</h3><div class="knoepfe" id="bewegungen"></div>
      <div class="reihe"><label>Tempo</label><input type="range" id="tempo" min="0.1" max="2" step="0.05" value="1"><span id="tempowert">1,00×</span></div>
      <div class="reihe"><label>Wiederholen</label><input type="checkbox" id="schleife" checked><button id="pause">Pause</button><button id="nochmal">Neu starten</button></div>
      <div class="reihe"><label>Drehen</label><input type="range" id="blick" min="-3.14" max="3.14" step="0.01" value="0.5"></div>
      <div class="reihe"><label>Effekt</label><button id="teleport">Teleport</button></div></div>
    <div class="feld"><h3>Waffen und Ausrüstung</h3><div id="teile"></div></div>
  </div>
</main>
<script src="figur3d.js?v=__V__"></script>
<script>
(async () => {
  const E = window.MytharaEcht3D, M = "../img/figuren-echt3d/", $ = (s) => document.querySelector(s);
  const L = await (await fetch("animationen-liste.json?v=__V__")).json(); const figuren = L.figuren;
  const PLATZNAME = { hand_r: "Rechte Hand", hand_l: "Linke Hand", arm_l: "Schild", haar: "Frisur", bart: "Bart", helm: "Kopf", brust: "Brust", beine: "Beine", schuerze: "Schürze" };
  const STUFE = { "": "Grundstufe", gewoehnlich: "Einfach", selten: "Selten", episch: "Episch", legendaer: "Legendär", mythisch: "Mythisch" };
  let d = null, fig = null, bew = "ruhe", tempo = 1, pause = false, gewaehlt = {}, stufe = {};
  const c = $("#c"), x = c.getContext("2d");
  for (const f of figuren) $("#figur").add(new Option(f.id, f.id)); $("#figur").value = figuren.find((f) => f.id === "basemann3d") ? "basemann3d" : figuren[0].id;
  function sichtbar() { if (!d) return; const ids = Object.entries(gewaehlt).filter(([, t]) => t).map(([p, t]) => t + (stufe[t] ? "." + stufe[t] : "")); d.zeige(ids);
    $("#info").textContent = `${fig.id} · ${bew} · ${ids.join(", ") || "ohne Teile"}`; }
  function spielen() { if (!d || !d.hat(bew)) return; d.neustart(); d.spiele(bew, !$("#schleife").checked); sichtbar(); }
  async function laden() {
    fig = figuren.find((f) => f.id === $("#figur").value); if (d) { d.entfernen(); d = null; }
    d = await E.Darsteller.erstellen(M + fig.id + ".glb", Math.min(520, window.innerHeight * 0.62), Math.min(2, devicePixelRatio || 1));
    c.width = d.breite; c.height = d.hoehe; c.style.width = d.breite / d.aufloesung + "px";
    $("#hautreihe").hidden = !fig.haut.length; $("#haut").innerHTML = '<option value="">Original</option>' + fig.haut.map((h) => `<option>${h}</option>`).join("");
    /* Bewegungen */
    const namen = Object.keys(fig.aktionen).sort(); if (!namen.includes(bew)) bew = namen.includes("ruhe") ? "ruhe" : namen[0];
    $("#bewegungen").innerHTML = namen.map((n) => `<button data-b="${n}" class="${n === bew ? "an" : ""}" title="${fig.aktionen[n].bilder} Bilder · ${(fig.aktionen[n].bilder / fig.aktionen[n].rate).toFixed(2)} s">${n}</button>`).join("");
    $("#bewegungen").querySelectorAll("button").forEach((b) => b.onclick = () => { bew = b.dataset.b; $("#bewegungen").querySelectorAll("button").forEach((k) => k.classList.toggle("an", k === b)); spielen(); });
    /* Teile je Platz */
    const plaetze = {}; for (const [t, i] of Object.entries(fig.teile)) if (i.platz) (plaetze[i.platz] ||= []).push(t);
    gewaehlt = {}; stufe = {};
    if (plaetze.hand_r) gewaehlt.hand_r = plaetze.hand_r.find((t) => t.includes("schwert")) || plaetze.hand_r[0];
    $("#teile").innerHTML = Object.entries(plaetze).map(([p, ts]) => `<div class="teil"><span class="name">${PLATZNAME[p] || p}</span><span></span>
        <select data-p="${p}"><option value="">– nichts –</option>${ts.sort().map((t) => `<option ${gewaehlt[p] === t ? "selected" : ""}>${t}</option>`).join("")}</select>
        <select data-s="${p}"></select></div>`).join("") || "<small>Diese Figur hat keine wechselbaren Teile.</small>";
    const stufenAuswahl = (p) => { const t = gewaehlt[p], s = (t && fig.stufen[t]) || [], el = $(`select[data-s="${p}"]`); el.hidden = !s.length;
      el.innerHTML = ["", ...s].map((v) => `<option value="${v}">${STUFE[v] || v}</option>`).join(""); el.value = stufe[t] || ""; };
    for (const p of Object.keys(plaetze)) stufenAuswahl(p);
    $("#teile").querySelectorAll("select[data-p]").forEach((el) => el.onchange = () => { gewaehlt[el.dataset.p] = el.value; stufenAuswahl(el.dataset.p); sichtbar(); });
    $("#teile").querySelectorAll("select[data-s]").forEach((el) => el.onchange = () => { const t = gewaehlt[el.dataset.s]; if (t) stufe[t] = el.value; sichtbar(); });
    d.blick(+$("#blick").value); spielen();
  }
  $("#figur").onchange = laden; $("#haut").onchange = () => { if (d && $("#haut").value) d.haut(M + "haut/" + fig.id + "." + $("#haut").value + ".webp"); else laden(); };
  $("#tempo").oninput = () => { tempo = +$("#tempo").value; $("#tempowert").textContent = tempo.toFixed(2).replace(".", ",") + "×"; };
  $("#blick").oninput = () => d && d.blick(+$("#blick").value);
  $("#pause").onclick = () => { pause = !pause; $("#pause").textContent = pause ? "Weiter" : "Pause"; };
  $("#nochmal").onclick = spielen; $("#schleife").onchange = spielen;
  $("#teleport").onclick = () => { if (!d) return; if (d.hat("teleport_weg")) d.spiele("teleport_weg", true); d.teleport(1.8); setTimeout(laden, 2600); };
  let zuletzt = performance.now();
  (function bild(t) { const dt = Math.min(0.1, (t - zuletzt) / 1000); zuletzt = t; if (d) d.zeichne(pause ? 0 : dt * tempo, x); requestAnimationFrame(bild); })(zuletzt);
  await laden();
})();
</script>
</body></html>
